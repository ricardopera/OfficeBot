appId: com.officebot.app
productName: OfficeBot
copyright: Copyright © 2024 OfficeBot

directories:
  output: release
  buildResources: resources

files:
  - out
  - dist

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: resources/icon.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
